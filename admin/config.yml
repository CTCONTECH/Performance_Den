
backend:
  name: github
  repo: CTCONTECH/Performance_Den
  branch: main
  site_domain: performanceden.netlify.app
  client_id: Ov23liTRcFa8Kgz5lYFC

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "builds"
    label: "Builds"
    folder: "content/builds"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
  - name: "instagram"
    label: "Instagram Posts"
    folder: "content/instagram"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Post URL", name: "url", widget: "string" }
      - { label: "Caption", name: "caption", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }
